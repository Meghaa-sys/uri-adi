<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MĀYĀLI — Uri Adi Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Experience the traditional Onam Uri Adi pot-breaking challenge in interactive 3D / WebXR VR!" />
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script>
  // ---------------------------------------------------------------
  // IMPORTANT: this registers the custom component BEFORE <a-scene>
  // is parsed. A-Frame attaches components to entities the moment
  // their HTML tag is parsed.
  // ---------------------------------------------------------------
  window.MAYALI = {
    resolved: false,
    timerActive: false,
    preset: { timeLimit: 20, swingSpeed: 2.4, swingAmplitude: 28, hitRadius: 0.45 },
    endChallenge: function () {} // real implementation attached later
  };

  // Web Audio sound synthesizer for realistic pot smash & victory celebration
  const SoundFX = {
    audioCtx: null,
    init() {
      if (!this.audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.audioCtx = new AudioCtx();
      }
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }
    },
    playSmash() {
      this.init();
      if (!this.audioCtx) return;
      const ctx = this.audioCtx;
      const now = ctx.currentTime;

      // Noise burst for ceramic shatter
      const bufferSize = ctx.sampleRate * 0.3;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.05));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(800, now);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);

      // Deep thump resonance
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
      oscGain.gain.setValueAtTime(0.7, now);
      oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

      osc.connect(oscGain);
      oscGain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    },
    playSwing() {
      this.init();
      if (!this.audioCtx) return;
      const ctx = this.audioCtx;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  };

  AFRAME.registerComponent('stick-swing', {
    init: function () {
      this.tipWorldPos = new THREE.Vector3();
      this.potWorldPos = new THREE.Vector3();
      this.lastTipPos = new THREE.Vector3();
      this.velocity = new THREE.Vector3();
    },
    tick: function (time, delta) {
      const state = window.MAYALI;
      const stick = this.el.querySelector('.stick');
      const potEntity = document.querySelector('#pot');
      if (!stick || !potEntity || !potEntity.object3D) return;
      if (state.resolved || !state.timerActive) return;

      stick.object3D.getWorldPosition(this.tipWorldPos);
      potEntity.object3D.getWorldPosition(this.potWorldPos);
      const dist = this.tipWorldPos.distanceTo(this.potWorldPos);

      this.velocity.copy(this.tipWorldPos).sub(this.lastTipPos);
      this.lastTipPos.copy(this.tipWorldPos);
      const speed = delta > 0 ? this.velocity.length() / (delta / 1000) : 0;

      // Check proximity or speed strike (VR motion controller or animated desktop poke)
      if (dist < state.preset.hitRadius) {
        SoundFX.playSmash();
        state.endChallenge(true);
      }
    }
  });
</script>

<style>
  /* ---------- Kerala Onam Palette ----------
     Kasavu Gold     #C9A227
     Terracotta Clay #B5502F
     Banana Leaf     #2F5233
     Marigold Orange #E8871E
     Dusk Sky        #3B2A4A -> #7A4A3A
  */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1c1410;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; pointer-events: none; z-index: 10;
    color: #F4E9CF; text-shadow: 0 2px 8px rgba(0,0,0,.7);
  }
  #hud .badge {
    font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(28, 20, 16, 0.65); padding: 8px 16px; border-radius: 20px;
    border: 1px solid rgba(201, 162, 39, 0.4); backdrop-filter: blur(8px);
  }
  #hud .timer {
    font-size: 32px; font-weight: 800; color: #E8871E;
    background: rgba(28, 20, 16, 0.75); padding: 6px 20px; border-radius: 30px;
    border: 2px solid #E8871E; box-shadow: 0 0 15px rgba(232, 135, 30, 0.4);
  }
  #startOverlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 20px;
    background: radial-gradient(circle at 50% 35%, #4a2f1f 0%, #1c1410 80%);
    color: #F4E9CF; padding: 20px;
  }
  #startOverlay h1 {
    font-size: 3rem; color: #C9A227; margin: 0; letter-spacing: .06em;
    text-shadow: 0 4px 12px rgba(0,0,0,0.5);
  }
  #startOverlay .subtitle {
    font-size: 1.1rem; color: #E8871E; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 600;
  }
  #startOverlay p {
    max-width: 480px; line-height: 1.6; opacity: .9; margin: 0; font-size: 1.05rem;
  }
  #startOverlay button {
    padding: 16px 42px; font-size: 1.15rem; border-radius: 999px; border: 2px solid #C9A227;
    background: linear-gradient(135deg, #E8871E, #B5502F); color: #FFF; font-weight: 700;
    cursor: pointer; letter-spacing: .04em; transition: all 0.25s ease;
    box-shadow: 0 6px 20px rgba(232, 135, 30, 0.4);
  }
  #startOverlay button:hover {
    transform: translateY(-2px) scale(1.03);
    background: linear-gradient(135deg, #C9A227, #E8871E);
    box-shadow: 0 8px 25px rgba(201, 162, 39, 0.6);
  }
  #startOverlay small { opacity: .7; font-family: monospace; font-size: 0.9rem; }
  .instructions {
    background: rgba(0,0,0,0.3); padding: 10px 18px; border-radius: 12px;
    font-size: 0.9rem; border: 1px solid rgba(244, 233, 207, 0.2);
  }
</style>
</head>
<body>

<div id="startOverlay">
  <div class="subtitle">Traditional Onam Game</div>
  <h1>Uri Adi</h1>
  <p>The decorated clay pot swings high from the frame. Find your moment, time your swing, and break the pot — Maveli is watching!</p>
  
  <div class="instructions">
    🎮 <strong>Controls:</strong> VR Controller Swing &nbsp;|&nbsp; 🖱️ Click/Tap screen to strike stick
  </div>

  <button id="beginBtn">Enter the Challenge</button>
  <small id="configLine">difficulty: medium</small>
</div>

<div id="hud" style="display:none;">
  <div class="badge" id="playerBadge">Player</div>
  <div class="timer" id="timerLabel">--</div>
  <div class="badge" id="scoreBadge">Score: 0</div>
</div>

<a-scene background="color: #241a10" vr-mode-ui="enabled: true">

  <!-- Dusk sky gradient via layered domes -->
  <a-sky color="#3B2A4A"></a-sky>
  <a-entity geometry="primitive: sphere; radius: 60; segmentsHeight: 16"
            material="color: #7A4A3A; opacity: 0.35; side: back; shader: flat"
            position="0 -20 0"></a-entity>

  <!-- Ground: banana-leaf green with pookalam ring pattern at center -->
  <a-plane rotation="-90 0 0" width="30" height="30" color="#2F5233" roughness="0.8"></a-plane>
  <a-entity id="pookalam" position="0 0.01 -2.2" rotation="-90 0 0">
    <a-ring radius-inner="0.05" radius-outer="0.35" color="#C9A227"></a-ring>
    <a-ring radius-inner="0.4"  radius-outer="0.7"  color="#E8871E"></a-ring>
    <a-ring radius-inner="0.75" radius-outer="1.0"  color="#B5502F"></a-ring>
    <a-ring radius-inner="1.05" radius-outer="1.25" color="#F4E9CF"></a-ring>
  </a-entity>

  <!-- Wooden frame holding the pot -->
  <a-box class="frame" position="-1.1 1.8 -2.2" width="0.12" height="3.6" depth="0.12" color="#5b3a21"></a-box>
  <a-box class="frame" position="1.1 1.8 -2.2" width="0.12" height="3.6" depth="0.12" color="#5b3a21"></a-box>
  <a-box class="frame" position="0 3.5 -2.2" width="2.35" height="0.12" depth="0.12" color="#5b3a21"></a-box>

  <!-- Pot pivot: this swings back & forth; the pot hangs from it -->
  <a-entity id="potPivot" position="0 3.44 -2.2">
    <a-cylinder position="0 -0.55 0" radius="0.015" height="1.1" color="#3a2a1a"></a-cylinder>
    <a-entity id="pot" class="clickable" position="0 -1.15 0">
      <a-sphere radius="0.28" color="#B5502F" roughness="0.95"></a-sphere>
      <a-cylinder position="0 0.24 0" radius="0.1" height="0.12" color="#8f3f22"></a-cylinder>
      <!-- Decorative gold neck ring -->
      <a-torus position="0 0.18 0" radius="0.18" radius-tubular="0.02" color="#C9A227"></a-torus>
    </a-entity>
  </a-entity>

  <!-- Broken-pot shards, hidden until hit -->
  <a-entity id="shards" visible="false" position="0 2.3 -2.2">
    <a-cone position="-0.15 0 0" radius-bottom="0.16" height="0.22" color="#B5502F" rotation="0 0 25"></a-cone>
    <a-cone position="0.18 0.05 0.1" radius-bottom="0.14" height="0.18" color="#8f3f22" rotation="0 0 -35"></a-cone>
    <a-sphere position="0 -0.1 -0.05" radius="0.08" color="#E8871E"></a-sphere>
  </a-entity>

  <!-- In-world message text -->
  <a-text id="worldMessage" value="" align="center" color="#F4E9CF" width="5"
          position="0 2.6 -1.9" visible="false" font="klaus"></a-text>

  <!-- Player rig -->
  <a-entity id="rig" position="0 0 1.2">
    <a-camera position="0 1.6 0" look-controls wasd-controls="enabled: false">
      <a-cursor color="#E8871E" raycaster="objects: .clickable"></a-cursor>
    </a-camera>

    <!-- Right hand controller with the stick attached; laser-controls covers VR controllers -->
    <a-entity id="rightHand"
              laser-controls="hand: right"
              stick-swing
              position="0.25 1.1 -0.3">
      <a-cylinder class="stick" radius="0.02" height="0.65" color="#4a2f1f" rotation="70 0 0"
                  position="0 0 -0.25"></a-cylinder>
    </a-entity>
  </a-entity>

</a-scene>

<script>
(function () {
  // ---- Config pulled from URL query parameters ----
  const params = new URLSearchParams(window.location.search);
  const difficulty = params.get('difficulty') || 'medium';
  const player = params.get('player') || 'red';
  const explicitTimeLimit = params.get('timeLimit');

  const DIFFICULTY_PRESETS = {
    easy:   { timeLimit: 30, swingSpeed: 1.6, swingAmplitude: 18, hitRadius: 0.55 },
    medium: { timeLimit: 20, swingSpeed: 2.4, swingAmplitude: 28, hitRadius: 0.45 },
    hard:   { timeLimit: 14, swingSpeed: 3.2, swingAmplitude: 40, hitRadius: 0.35 }
  };
  const preset = DIFFICULTY_PRESETS[difficulty] || DIFFICULTY_PRESETS.medium;
  if (explicitTimeLimit) preset.timeLimit = parseFloat(explicitTimeLimit);

  window.MAYALI.preset = preset;

  document.getElementById('configLine').textContent = `player: ${player} · difficulty: ${difficulty}`;
  document.getElementById('playerBadge').textContent = player.toUpperCase();

  function sendResultToServer(result) {
    console.log('[MAYALI] challenge result ->', { player, difficulty, ...result });
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'mayali_challenge_result', player, difficulty, ...result }, '*');
    }
  }

  let score = 0;
  let timeLeft = preset.timeLimit;

  const timerLabel = document.getElementById('timerLabel');
  const worldMessage = document.querySelector('#worldMessage');
  const potPivot = document.querySelector('#potPivot');
  const potEntity = document.querySelector('#pot');
  const shards = document.querySelector('#shards');

  function startSwing() {
    potPivot.setAttribute('animation', {
      property: 'rotation',
      from: `0 0 -${preset.swingAmplitude}`,
      to: `0 0 ${preset.swingAmplitude}`,
      dir: 'alternate',
      loop: true,
      dur: (1000 / preset.swingSpeed) * 250,
      easing: 'easeInOutSine'
    });
  }

  function stopSwing() {
    potPivot.removeAttribute('animation');
  }

  function showMessage(text, ms) {
    worldMessage.setAttribute('value', text);
    worldMessage.setAttribute('visible', true);
    if (ms) setTimeout(() => worldMessage.setAttribute('visible', false), ms);
  }

  function tickTimer() {
    timeLeft -= 1;
    timerLabel.textContent = Math.max(timeLeft, 0);
    if (timeLeft <= 0) endChallenge(false);
  }

  let timerHandle = null;

  function beginChallenge() {
    SoundFX.init();
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    let count = 3;
    showMessage(String(count), 900);
    const countdown = setInterval(() => {
      count -= 1;
      if (count > 0) {
        showMessage(String(count), 900);
      } else {
        clearInterval(countdown);
        showMessage('Uri Adi!', 900);
        startSwing();
        timerLabel.textContent = timeLeft;
        window.MAYALI.timerActive = true;
        timerHandle = setInterval(tickTimer, 1000);
      }
    }, 1000);
  }

  function endChallenge(success) {
    if (window.MAYALI.resolved) return;
    window.MAYALI.resolved = true;
    window.MAYALI.timerActive = false;
    clearInterval(timerHandle);
    stopSwing();

    if (success) {
      potPivot.setAttribute('visible', false);
      shards.setAttribute('visible', true);
      shards.setAttribute('animation__burst', {
        property: 'scale', from: '1 1 1', to: '1.8 1.8 1.8', dur: 500, easing: 'easeOutQuad'
      });
      showMessage('Poo pottichu! Victory!', 3500);
      document.getElementById('scoreBadge').textContent = `Score: ${++score}`;
    } else {
      showMessage("Time's up — the pot swings on.", 3500);
    }

    sendResultToServer({
      success,
      timeTaken: preset.timeLimit - Math.max(timeLeft, 0),
      timeLimit: preset.timeLimit
    });
  }

  window.MAYALI.endChallenge = endChallenge;
  document.getElementById('beginBtn').addEventListener('click', beginChallenge);

  // Responsive desktop/mobile click handler: animate stick swing and calculate strike proximity
  function handleDesktopStrike() {
    if (window.MAYALI.resolved || !window.MAYALI.timerActive) return;
    SoundFX.playSwing();

    const rightHand = document.querySelector('#rightHand');
    const stick = document.querySelector('#rightHand .stick');

    // Temporarily move rightHand toward pot direction for poke animation
    rightHand.setAttribute('animation__strike', {
      property: 'position',
      to: '0 1.9 -1.6',
      dur: 150,
      dir: 'alternate',
      loop: 1
    });

    stick.setAttribute('animation__poke', {
      property: 'position', to: '0 0 -0.8', dur: 150, dir: 'alternate', loop: 1
    });

    // Check hit logic at peak of swing
    setTimeout(() => {
      if (window.MAYALI.resolved || !window.MAYALI.timerActive) return;
      const potObj = potEntity.object3D;
      const stickObj = stick.object3D;
      const potWorld = new THREE.Vector3();
      const stickWorld = new THREE.Vector3();
      potObj.getWorldPosition(potWorld);
      stickObj.getWorldPosition(stickWorld);

      const d = stickWorld.distanceTo(potWorld);
      if (d < window.MAYALI.preset.hitRadius * 2.2) {
        SoundFX.playSmash();
        endChallenge(true);
      }
    }, 120);
  }

  document.querySelector('a-scene').addEventListener('click', handleDesktopStrike);
  potEntity.addEventListener('click', handleDesktopStrike);
})();
</script>
</body>
</html>
